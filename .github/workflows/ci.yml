name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The packaged lockfile is a metadata seed because the authoring sandbox
      # cannot reach npm. The registry-connected workflow resolves it first.
      # Commit the resolved package-lock.json after the first local npm install.
      - name: Resolve dependency lock from registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build static site
        run: npm run build
