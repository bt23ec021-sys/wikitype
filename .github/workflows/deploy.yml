name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Determine Vite base path
        env:
          REPOSITORY: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          OVERRIDE: ${{ vars.VITE_BASE_PATH }}
        run: |
          if [[ -n "$OVERRIDE" ]]; then
            echo "VITE_BASE_PATH=$OVERRIDE" >> "$GITHUB_ENV"
          elif [[ "${REPOSITORY,,}" == "${OWNER,,}.github.io" ]]; then
            echo 'VITE_BASE_PATH=/' >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/$REPOSITORY/" >> "$GITHUB_ENV"
          fi
      # The packaged lockfile is a metadata seed because the authoring sandbox
      # cannot reach npm. The registry-connected workflow resolves it first.
      # Commit the resolved package-lock.json after the first local npm install.
      - name: Resolve dependency lock from registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci
      - name: Validate project
        run: |
          npm run lint
          npm run typecheck
          npm run test
      - name: Build
        run: npm run build
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
